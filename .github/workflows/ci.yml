name: CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**"]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Assert .env is not tracked
        run: |
          if git ls-files | grep -E '^backend/\.env$'; then
            echo "ERROR: .env file is tracked by git — remove it immediately"
            exit 1
          fi
          echo "PASS: .env is not tracked"

      - name: Run pytest
        working-directory: backend
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-test-secret-key-not-for-production' }}
        run: pytest -v --tb=short
